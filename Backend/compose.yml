# version: "3.9"

services:

  db:
    image: postgres:16
    container_name: cpms_postgres
    restart: always
    environment:
      POSTGRES_USER: cpms
      POSTGRES_PASSWORD: cpms
      POSTGRES_DB: cpms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: cpms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: docker/api.DOCKERFILE
    container_name: cpms_api
    depends_on:
      - db
      - minio
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
  minio_data: