services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: campushire-postgres
    environment:
      POSTGRES_USER: campushire
      POSTGRES_PASSWORD: campushire
      POSTGRES_DB: campushire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - campushire-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushire"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO File Storage
  minio:
    image: minio/minio:latest
    container_name: campushire-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - campushire-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: campushire-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://campushire:campushire@postgres:5432/campushire_db
      - PASETO_SECRET_KEY=change-me-in-codespace-and-production
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001", "http://localhost:5173"]
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET_MATERIALS=study-materials
      - DEBUG=true
    volumes:
      - ./Backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - campushire-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushire-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=/api/v1
      - API_PROXY_TARGET=http://backend:8000
      - REACT_APP_IS_DOCKER=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    networks:
      - campushire-network

networks:
  campushire-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  backend-data:
  frontend-node-modules:
