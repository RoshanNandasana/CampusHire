version: '3.8'

services:
  # Backend FastAPI Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: campushire-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./campushire.db
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ./Backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - campushire-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushire-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command: npm start
    networks:
      - campushire-network

networks:
  campushire-network:
    driver: bridge

volumes:
  backend-data:
  frontend-node-modules:
